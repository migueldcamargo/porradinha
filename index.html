<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16274a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Porradinha">
<title>PORRADINHA · República Rapina</title>
<!-- Ícone do app (águia da Rapina). Hospedado: arquivos PNG + manifest. Arquivo solto: gerados em JS (setupIcons) -->
<link rel="icon" id="favicon" href="data:,">
<link rel="apple-touch-icon" id="appleIcon" href="apple-touch-icon.png">
<link rel="manifest" id="manifestLink" href="manifest.webmanifest">
<!-- Fonte opcional: sem internet, cai para Impact / Arial Black -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap">
<style>
/* =====================================================================
   PORRADINHA — estilos
   ===================================================================== */
:root {
  --navy: #16274a;
  --navy-2: #0d1830;
  --navy-3: #243c6b;
  --orange: #ff6a13;
  --orange-2: #ff8f45;
  --orange-dark: #b8440a;
  --white: #ffffff;
  --display: 'Anton', Impact, 'Arial Black', 'Helvetica Neue', system-ui, sans-serif;
  --body: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --marker: 'Permanent Marker', 'Segoe Print', 'Comic Sans MS', cursive;
  --live: #3ee07f;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--navy-2);
  color: var(--white);
  font-family: var(--body);
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
/* Sem zoom por pinça / duplo toque: quem entende "pan-x pan-y" usa; o resto fica com "manipulation" */
*, *::before, *::after { touch-action: manipulation; touch-action: pan-x pan-y; }
input { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ---------- Telas ---------- */
.screen {
  position: fixed;
  inset: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: calc(var(--safe-top) + 14px) 18px calc(var(--safe-bottom) + 14px);
  overflow: hidden;
  background: var(--navy-2);
}
.screen::before { /* faixas diagonais inspiradas na logo — fixas: não acabam quando a tela rola */
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(118deg, transparent 0 60%, rgba(255,255,255,.05) 60% 67%, rgba(255,106,19,.20) 67% 100%),
    radial-gradient(120% 60% at 0% 100%, rgba(36,60,107,.9), transparent 70%);
}
.screen > * { position: relative; }
.screen.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* ---------- Botões ---------- */
.btn {
  appearance: none;
  border: 0;
  width: 100%;
  height: 64px;
  border-radius: 18px;
  font-family: var(--display);
  font-size: 24px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #fff;
  background: var(--orange);
  box-shadow: 0 6px 0 var(--orange-dark), 0 14px 28px rgba(255,106,19,.30);
  cursor: pointer;
  transition: transform .08s, box-shadow .08s, background .2s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--orange-dark), 0 6px 14px rgba(255,106,19,.25); }
.btn.is-cooling { background: #4b5670; box-shadow: 0 6px 0 #313a4f; }
.btn.is-cooling:active { box-shadow: 0 2px 0 #313a4f; }
.btn-white { background: #fff; color: var(--navy); box-shadow: 0 6px 0 #c3cbdb, 0 14px 28px rgba(0,0,0,.25); }
.btn-white:active { box-shadow: 0 2px 0 #c3cbdb; }
.btn-ghost {
  background: transparent;
  border: 2px solid rgba(255,255,255,.28);
  box-shadow: none;
  height: 56px;
  font-size: 19px;
}
.btn-ghost:active { box-shadow: none; background: rgba(255,255,255,.08); }
.btn-danger { background: #e23b3b; box-shadow: 0 6px 0 #9c2323; }
.btn-danger:active { box-shadow: 0 2px 0 #9c2323; }

/* ---------- Logo ---------- */
.logo { display: block; overflow: hidden; background: #fff; flex: none; }
.logo svg, .logo img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* =====================================================================
   TELA INICIAL
   ===================================================================== */
.start-wrap {
  margin: auto;
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 8px 0;
}
.start-logo {
  width: 120px; height: 120px;
  margin: 0 auto 4px;
  border-radius: 26px;
  box-shadow: 0 0 0 4px #fff, 0 16px 36px rgba(0,0,0,.45);
  transform: rotate(-4deg);
}
.app-title {
  margin: 4px 0 0;
  text-align: center;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(50px, 15vw, 72px);
  line-height: .95;
  letter-spacing: 1px;
  color: #fff;
  text-shadow: 4px 4px 0 var(--orange);
}
.tagline { margin: 0 0 10px; text-align: center; font-size: 21px; font-weight: 800; }
.field label {
  display: block;
  margin: 0 0 6px 2px;
  font-family: var(--display);
  font-size: 16px;
  letter-spacing: 1px;
  color: var(--orange-2);
}
.field label small { font-family: var(--body); font-size: 12px; font-weight: 700; letter-spacing: 0; color: rgba(255,255,255,.55); }
.field input, .sheet input {
  width: 100%;
  height: 60px;
  padding: 0 16px;
  border-radius: 16px;
  border: 2px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.08);
  color: #fff;
  font-size: 21px;
  font-weight: 800;
  outline: none;
}
.field input:focus, .sheet input:focus { border-color: var(--orange); background: rgba(255,255,255,.13); }
.field input::placeholder, .sheet input::placeholder { color: rgba(255,255,255,.32); }
.field.has-error input { border-color: #ff5a5a; animation: shake .35s; }
.field-error { min-height: 18px; margin: 6px 0 0 2px; font-size: 14px; font-weight: 700; color: #ff9b9b; }
.start-wrap .btn { margin-top: 6px; }

/* =====================================================================
   TELA PRINCIPAL
   ===================================================================== */
.topbar { display: flex; align-items: center; gap: 12px; flex: none; }
.logo-sm { width: 50px; height: 50px; border-radius: 13px; box-shadow: 0 0 0 2px #fff; }
.who { flex: 1; min-width: 0; }
.who-nick {
  font-family: var(--display);
  font-size: 28px;
  line-height: 1.05;
  text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.who-org { font-size: 15px; font-weight: 800; color: var(--orange-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  flex: none;
  width: 54px; height: 54px;
  border: 0; border-radius: 16px;
  background: rgba(255,255,255,.10);
  font-size: 28px; line-height: 1;
  cursor: pointer;
}
.icon-btn:active { background: rgba(255,255,255,.2); }

.stage { flex: 1; min-height: 150px; position: relative; margin: 6px -18px 0; }
.stage::before { /* brilho atrás do copo */
  content: "";
  position: absolute;
  left: 50%; bottom: 0;
  width: 90%; height: 80%;
  transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(255,106,19,.35), transparent);
  pointer-events: none;
}
.table {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 14px;
  background: linear-gradient(var(--orange), #c24d0b);
  box-shadow: 0 -2px 0 rgba(255,255,255,.35);
}
.cup-pos {
  position: absolute;
  bottom: 12px;
  left: 50%;
  height: calc(100% - 16px);
  aspect-ratio: 220 / 420;
  transform: translateX(-50%);
  cursor: pointer;
}
.cup-wrap { width: 100%; height: 100%; transform-origin: 50% 100%; }
.cup-wrap svg { display: block; width: 100%; height: 100%; overflow: visible; }
.tap-hint {
  position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
  white-space: nowrap; font-size: 12px; font-weight: 800; letter-spacing: 1px;
  color: rgba(255,255,255,.0); pointer-events: none; transition: color .3s;
}

/* Líquido / espuma / bolhas */
#liquid { transform: translateY(calc((1 - var(--fill, 1)) * 226px)); transition: transform .3s linear; }
#foam { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); opacity: 0; transition: transform .75s cubic-bezier(.2,1.5,.4,1), opacity .25s; }
.drip { opacity: 0; transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0); transition: transform .5s .45s ease-out, opacity .2s .45s; }
.cup-wrap.foamy #foam { transform: scaleY(1); opacity: 1; }
.cup-wrap.foamy .drip { transform: scaleY(1); opacity: 1; }
.cup-wrap.foamy .foam-inner { animation: foamWobble .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
#bubbles circle { opacity: 0; animation: rise 3s ease-in infinite; }
#bubbles circle:nth-child(2n)   { animation-duration: 3.7s; animation-delay: -1.3s; }
#bubbles circle:nth-child(3n)   { animation-duration: 2.6s; animation-delay: -2.1s; }
#bubbles circle:nth-child(4n+1) { animation-delay: -.7s; }
#bubbles circle:nth-child(5n)   { animation-delay: -2.8s; }
.cup-wrap.bubbling #bubbles circle { animation-duration: .8s; }
.cup-wrap.ready { animation: readyPulse 2.4s ease-in-out infinite; }

/* Sequência da Porradinha */
.cup-wrap.slam  { animation: slam .42s cubic-bezier(.55,0,.8,.2) both; }
.cup-wrap.shake { animation: cupShake .3s linear both; }
.cup-wrap.drink { animation: drink 1.05s ease-in-out both; transform-origin: 50% 55%; }
.impact { position: absolute; left: 50%; bottom: 4px; width: 78%; transform: translateX(-50%); opacity: 0; pointer-events: none; overflow: visible; }
.impact.go { animation: impact .5s ease-out both; }

.counter { flex: none; text-align: center; line-height: .9; margin-top: 10px; }
.count-num {
  display: inline-block;
  font-family: var(--display);
  font-size: clamp(66px, 21vw, 100px);
  color: #fff;
  text-shadow: 5px 5px 0 var(--orange);
}
.count-num.bump { animation: bump .55s cubic-bezier(.2,1.6,.4,1); }
.count-label { font-family: var(--display); font-size: 21px; letter-spacing: 4px; color: var(--orange-2); }
.cool-line { flex: none; height: 26px; margin: 6px 0 8px; text-align: center; font-size: 16px; font-weight: 800; color: rgba(255,255,255,.75); }
.cool-line b { color: #fff; font-variant-numeric: tabular-nums; }

/* Slider “deslize para finalizar” */
.slider {
  position: relative;
  flex: none;
  height: 58px;
  margin-top: 14px;
  border-radius: 999px;
  border: 2px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.05);
  overflow: hidden;
  touch-action: none;
}
.slider-fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: rgba(255,106,19,.28); }
.slider-text {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding-left: 46px;
  font-family: var(--display); font-size: 16px; letter-spacing: 1.5px;
  color: rgba(255,255,255,.62);
  opacity: calc(1 - var(--p, 0) * 1.6);
  pointer-events: none;
}
.slider-text .arrows { margin-left: 8px; color: var(--orange-2); animation: arrows 1.4s ease-in-out infinite; }
.slider-thumb {
  position: absolute; top: 4px; left: 4px;
  width: 46px; height: 46px;
  border: 0; border-radius: 50%;
  background: #fff; color: var(--navy);
  font-size: 24px; font-weight: 900; line-height: 1;
  display: grid; place-items: center;
  box-shadow: 0 3px 10px rgba(0,0,0,.35);
  touch-action: none;
  cursor: grab;
}
.slider.returning .slider-thumb { transition: transform .28s cubic-bezier(.3,1.4,.5,1); }
.slider.returning .slider-fill { transition: width .28s; }
.slider.nudge .slider-thumb { animation: nudge .6s ease-in-out; }

/* =====================================================================
   CONTAGEM 1-2-3
   ===================================================================== */
.countdown {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center;
  background: rgba(8,14,28,.62);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
}
.cd-text {
  font-family: var(--display);
  font-size: min(52vw, 280px);
  line-height: 1;
  color: #fff;
  text-shadow: 8px 8px 0 var(--orange);
}
.cd-text.word { font-size: clamp(54px, 17vw, 110px); color: var(--orange); text-shadow: 5px 5px 0 #fff; transform: rotate(-6deg); }
.cd-text.pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
.cd-text.word.pop { animation: popWord .6s cubic-bezier(.2,1.6,.4,1) both; }

/* =====================================================================
   SHEETS / DIÁLOGOS / TOAST
   ===================================================================== */
.overlay {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: flex-end; justify-content: center;
  padding: 16px 14px calc(var(--safe-bottom) + 14px);
  background: rgba(5,10,22,.74);
  animation: fadeIn .18s ease-out;
}
.sheet {
  width: 100%; max-width: 440px;
  max-height: calc(100dvh - 40px); overflow-y: auto;
  padding: 22px 20px 18px;
  border-radius: 28px;
  border: 2px solid rgba(255,255,255,.12);
  background: var(--navy);
  box-shadow: 0 -10px 40px rgba(0,0,0,.4);
  animation: sheetIn .25s cubic-bezier(.2,1.2,.4,1);
}
.sheet .emoji { font-size: 54px; line-height: 1; text-align: center; margin-bottom: 8px; }
.sheet h2 { margin: 0 0 8px; font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.05; text-align: center; letter-spacing: .5px; }
.sheet p { margin: 0 0 16px; font-size: 18px; line-height: 1.4; text-align: center; color: rgba(255,255,255,.86); }
.sheet .big-timer { margin: -4px 0 16px; text-align: center; font-size: 18px; font-weight: 800; color: rgba(255,255,255,.8); }
.sheet .big-timer b { display: block; font-family: var(--display); font-weight: 400; font-size: 64px; line-height: 1.05; color: var(--orange); font-variant-numeric: tabular-nums; }
.sheet input { margin-bottom: 6px; }
.sheet .field-error { text-align: left; }
.sheet .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.menu-list { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 12px; }
.menu-item {
  display: flex; align-items: center; gap: 14px;
  width: 100%; min-height: 60px; padding: 0 16px;
  border: 0; border-radius: 16px;
  background: rgba(255,255,255,.07);
  font-size: 18px; font-weight: 800; text-align: left;
  cursor: pointer;
}
.menu-item:active { background: rgba(255,255,255,.15); }
.menu-item .mi-icon { width: 30px; font-size: 22px; text-align: center; }
.menu-item.danger { color: #ff9b9b; }

.toast {
  position: fixed; z-index: 55;
  left: 14px; right: 14px;
  top: calc(var(--safe-top) + 78px);
  max-width: 440px; margin: 0 auto;
  padding: 16px 18px;
  border-radius: 18px;
  border-left: 10px solid var(--orange);
  background: #fff; color: var(--navy);
  font-size: 19px; font-weight: 900; line-height: 1.3;
  box-shadow: 0 14px 34px rgba(0,0,0,.45);
  animation: toastIn .35s cubic-bezier(.2,1.4,.4,1);
}
.toast.out { animation: toastOut .25s ease-in both; }

/* =====================================================================
   TELA FINAL — CARD PARA STORIES
   ===================================================================== */
#screen-result { align-items: center; padding-bottom: calc(var(--safe-bottom) + 120px); }
.story-card {
  flex: none;
  position: relative;
  width: clamp(270px, calc((100dvh - 150px) * 0.5625), 430px);
  max-width: 100%;
  aspect-ratio: 9 / 16;
  container-type: inline-size;
  overflow: hidden;
  border-radius: 26px;
  background: var(--navy);
  box-shadow: 0 20px 50px rgba(0,0,0,.5);
  display: flex; flex-direction: column; align-items: center;
  padding: 7cqw 6cqw 6cqw;
  text-align: center;
  isolation: isolate;
}
.story-card::before { /* faixas da logo */
  content: ""; position: absolute; inset: 0; z-index: -1;
  background:
    linear-gradient(122deg, transparent 0 56%, #fff 56% 60.5%, var(--orange) 60.5% 100%);
  opacity: 1;
  clip-path: polygon(0 62%, 100% 38%, 100% 100%, 0 100%);
}
.story-card::after { /* retícula sutil */
  content: ""; position: absolute; inset: 0; z-index: -1;
  background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1.4px);
  background-size: 3.2cqw 3.2cqw;
  -webkit-mask-image: linear-gradient(#000, transparent 60%); mask-image: linear-gradient(#000, transparent 60%);
}
.sc-head { display: flex; align-items: center; justify-content: center; gap: 3.5cqw; }
.sc-logo { width: 19cqw; height: 19cqw; border-radius: 4.5cqw; box-shadow: 0 0 0 1.1cqw #fff; transform: rotate(-5deg); }
.sc-title { font-family: var(--display); font-size: 13.5cqw; line-height: 1; letter-spacing: .3cqw; text-shadow: 1cqw 1cqw 0 var(--orange); }
.sc-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 0; }
.sc-nick {
  max-width: 100%;
  font-family: var(--display); font-size: 13cqw; line-height: 1.05;
  text-transform: uppercase; overflow-wrap: anywhere;
}
.sc-org {
  margin-top: 1.5cqw; padding: .8cqw 3.6cqw;
  border-radius: 99px; background: var(--orange);
  font-family: var(--display); font-size: 5.6cqw; letter-spacing: .4cqw; text-transform: uppercase;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sc-took { margin-top: 4cqw; font-family: var(--display); font-size: 6cqw; letter-spacing: 1.4cqw; color: rgba(255,255,255,.75); }
.sc-num-row { position: relative; display: flex; align-items: center; justify-content: center; }
.sc-num {
  font-family: var(--display); font-size: 44cqw; line-height: .92;
  color: #fff; text-shadow: 1.6cqw 1.6cqw 0 var(--orange), -.4cqw -.4cqw 0 var(--navy-2);
  font-variant-numeric: tabular-nums;
}
.sc-num.d3 { font-size: 34cqw; }
.sc-cup { position: absolute; right: -15cqw; bottom: 2cqw; width: 15cqw; transform: rotate(14deg); filter: drop-shadow(0 1cqw 1cqw rgba(0,0,0,.35)); }
.sc-label {
  margin-top: 1cqw; padding: 0 3cqw;
  font-family: var(--display); font-size: 9.5cqw; letter-spacing: .6cqw; line-height: 1.1;
  color: var(--navy); background: #fff; transform: rotate(-3deg);
  box-shadow: 1.2cqw 1.2cqw 0 var(--orange);
}
.sc-foot { width: 100%; }
/* discreto: convite pequeno, mas com fundo próprio para ler em cima da faixa branca ou laranja */
.sc-post {
  display: inline-block; padding: .8cqw 3cqw;
  border-radius: 99px;
  background: rgba(13,24,48,.9);
  font-size: 3cqw; font-weight: 800; letter-spacing: .6cqw;
  color: #fff;
}
.sc-handle { margin-top: .6cqw; font-family: var(--display); font-size: 8.5cqw; letter-spacing: .2cqw; color: #fff; text-shadow: .8cqw .8cqw 0 var(--navy); }
.sc-date { margin-top: .6cqw; font-size: 3cqw; font-weight: 800; color: rgba(255,255,255,.85); }
.result-actions { flex: none; width: clamp(270px, calc((100dvh - 150px) * 0.5625), 430px); max-width: 100%; margin-top: 18px; }

.undo {
  position: fixed; z-index: 45;
  left: 12px; right: 12px;
  bottom: calc(var(--safe-bottom) + 12px);
  max-width: 460px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 12px 16px 16px;
  overflow: hidden;
  border-radius: 20px;
  background: #fff; color: var(--navy);
  box-shadow: 0 14px 40px rgba(0,0,0,.5);
  animation: toastIn .35s cubic-bezier(.2,1.4,.4,1);
}
.undo-text { flex: 1; font-size: 15px; font-weight: 800; line-height: 1.25; }
.undo-text small { display: block; font-size: 13px; font-weight: 700; opacity: .65; }
.undo .btn { width: auto; height: 50px; padding: 0 16px; font-size: 17px; }
.undo-bar { position: absolute; left: 0; bottom: 0; height: 6px; width: 100%; background: var(--orange); transition: width .25s linear; }

/* =====================================================================
   RANKING
   ===================================================================== */
#screen-ranking { padding-bottom: 0; }
/* flex: none — sem isso a lista era espremida na altura da tela e os botões "grudavam" no meio dela */
.rank-inner { flex: none; width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100%; }
.rank-head { display: flex; align-items: center; gap: 14px; margin: 4px 0 4px; }
.rank-title { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(28px, 8.4vw, 38px); line-height: 1; }
.rank-title span { color: var(--orange-2); }
.rank-sub { margin: 4px 0 18px; font-size: 14px; font-weight: 700; color: rgba(255,255,255,.62); }
.rank-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rank-row {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px 12px 10px;
  border-radius: 18px;

}

/* =====================================================================
   ANIMAÇÕES
   ===================================================================== */
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(7px); } 75% { transform: translateX(-4px); } }
@keyframes pop { 0% { transform: scale(.2); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes popWord { 0% { transform: scale(.2) rotate(-20deg); opacity: 0; } 100% { transform: scale(1) rotate(-6deg); opacity: 1; } }
@keyframes slam {
  0%   { transform: translateY(0) rotate(0); }
  40%  { transform: translateY(-16%) rotate(-4deg); }
  88%  { transform: translateY(0) scale(1.04, .94); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes cupShake {
  0%,100% { transform: translate(0,0) rotate(0); }
  20% { transform: translate(-7px,1px) rotate(-2.5deg); }
  40% { transform: translate(6px,0) rotate(2deg); }
  60% { transform: translate(-4px,1px) rotate(-1.2deg); }
  80% { transform: translate(3px,0) rotate(.8deg); }
}
@keyframes drink {
  0%   { transform: translate(0,0) rotate(0); }
  28%  { transform: translate(-6%,-22%) rotate(-62deg); }
  72%  { transform: translate(-8%,-24%) rotate(-78deg); }
  100% { transform: translate(0,0) rotate(0); }
}
@keyframes impact { 0% { opacity: 1; transform: translateX(-50%) scale(.5); } 100% { opacity: 0; transform: translateX(-50%) scale(1.35); } }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-190px); opacity: 0; } }
@keyframes foamWobble { from { transform: scale(1, 1); } to { transform: scale(1.03, 1.08); } }
@keyframes readyPulse { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5%); } }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.35); color: var(--orange-2); } 100% { transform: scale(1); } }
@keyframes arrows { 0%,100% { transform: translateX(0); opacity: .5; } 50% { transform: translateX(6px); opacity: 1; } }
@keyframes nudge { 0%,100% { transform: translateX(0); } 30% { transform: translateX(40px); } 60% { transform: translateX(0); } 80% { transform: translateX(14px); } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes sheetIn { from { transform: translateY(40px); opacity: 0; } }
@keyframes toastIn { from { transform: translateY(-24px) scale(.96); opacity: 0; } }
@keyframes toastOut { to { transform: translateY(-20px); opacity: 0; } }

/* =====================================================================
   v1.1 — assinatura, senha, instalar, ranking ao vivo, filtro, vertical
   ===================================================================== */
.btn:disabled { opacity: .6; cursor: not-allowed; }
.btn:disabled:active { transform: none; }
.start-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 20px; margin-top: 2px; }
.link-btn {

}
.role-tag {

}

/* Assinatura dos recados: "Att. / O Rapineiro" em letra de caneta */
.signature {

}

.sc-sign { margin-top: 1.4cqw; white-space: pre-line; font-family: var(--marker); font-size: 4.3cqw; line-height: 1.1; color: #fff; transform: rotate(-3deg); text-shadow: .5cqw .5cqw 0 var(--navy); }

/* Guia "instalar como app" */
.install-browser { margin: -6px 0 12px; text-align: center; font-size: 14px; font-weight: 700; color: rgba(255,255,255,.65); }
.install-browser b { color: var(--orange-2); }
.install-steps { list-style: none; counter-reset: step; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
.install-steps li {
  counter-increment: step;
  display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center;
  padding: 12px 14px 12px 12px;
  border-radius: 16px; background: rgba(255,255,255,.07);
  font-size: 16px; font-weight: 700; line-height: 1.5; text-align: left;
}
.install-steps li::before {
  content: counter(step);

}
.chip-ui {

}

.sheet .install-note { margin: 0 0 12px; font-size: 14px; color: rgba(255,255,255,.65); }
.install .btn { margin-bottom: 14px; }
.install-timer { height: 6px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.install-timer i { display: block; height: 100%; background: var(--orange); animation: drain 5s linear forwards; }

/* Ranking ao vivo */
.rank-sub { margin-bottom: 10px; }
.rank-legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.st {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 11px; border-radius: 99px;
  background: rgba(255,255,255,.08);
  font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums;
}
.st i, .rank-status.st-live i { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--live); animation: livePulse 1.6s ease-out infinite; }
.rank-status {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 5px; padding: 2px 9px;
  border-radius: 99px;
  font-size: 11px; font-weight: 900; letter-spacing: .6px;
}
.rank-status.st-live { background: rgba(62,224,127,.16); color: #a6f3c4; }
.rank-status.st-done { background: rgba(255,255,255,.1); color: rgba(255,255,255,.75); }
.rank-row.p1 .rank-status { background: rgba(13,24,48,.3); color: #fff; }
.rank-pos { position: relative; }
.rank-num { display: inline-block; }
.rank-num.count-up { animation: countUp .8s cubic-bezier(.2,1.6,.4,1); }
.rank-row.overtake { animation: overtake 1.2s ease-out; }
.rank-row.overtake .rank-pos::after {
  content: "▲"; position: absolute; left: 50%; top: -12px;
  font-size: 15px; color: var(--live);
  animation: upArrow 1.3s ease-out forwards;
}
.rank-row.is-new { animation: rowIn .5s ease-out; }
.rank-empty {
  padding: 26px 18px; border-radius: 18px;
  border: 2px dashed rgba(255,255,255,.2);
  text-align: center; font-size: 16px; font-weight: 700; line-height: 1.4; color: rgba(255,255,255,.75);
}
.btn-ghost.danger-ghost { color: #ff9b9b; border-color: rgba(255,120,120,.45); }

/* Filtro de repúblicas */
.rank-tools { display: flex; margin: 0 0 16px; }
.filter-btn {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 10px;
  min-height: 54px; padding: 0 16px;

  background: rgba(255,255,255,.06);
  text-align: left; cursor: pointer;
}
.filter-btn:active { background: rgba(255,255,255,.14); }
.filter-btn:disabled { opacity: .5; cursor: default; }
.filter-btn.is-filtered { border-color: var(--orange); background: rgba(255,106,19,.12); }
.fb-label { flex: none; font-family: var(--display); font-size: 15px; letter-spacing: 1px; color: var(--orange-2); }
.fb-value { flex: 1; min-width: 0; font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fb-caret { flex: none; font-size: 18px; opacity: .7; }
.filter-quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.pill-btn {
  appearance: none; min-height: 40px; padding: 0 14px;
  border: 2px solid rgba(255,255,255,.24); border-radius: 99px; background: transparent;
  font-size: 14px; font-weight: 800; cursor: pointer;
}
.pill-btn:active { background: rgba(255,255,255,.12); }
.check-list { display: grid; gap: 8px; margin-bottom: 8px; }
.check-row {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  min-height: 58px; padding: 0 14px;
  border-radius: 16px; background: rgba(255,255,255,.07);
  cursor: pointer;
}
.check-row input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.check-box {
  flex: none; width: 28px; height: 28px;
  display: grid; place-items: center;
  border: 2px solid rgba(255,255,255,.45); border-radius: 8px;
  font-size: 17px; font-weight: 900; color: transparent;
  transition: background .12s, border-color .12s;
}
.check-row input:checked + .check-box { background: var(--orange); border-color: var(--orange); color: #fff; }
.check-row input:focus-visible + .check-box { outline: 3px solid #fff; outline-offset: 2px; }
.check-label { flex: 1; min-width: 0; font-size: 17px; font-weight: 800; overflow-wrap: anywhere; }
.check-count { flex: none; font-size: 13px; font-weight: 800; color: rgba(255,255,255,.6); font-variant-numeric: tabular-nums; }

/* Aviso de celular deitado */
.rotate-lock {
  display: none;
  position: fixed; inset: 0; z-index: 1000;
  flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: 20px; text-align: center;
  background: var(--navy-2);
}
.is-landscape .rotate-lock { display: flex; }
.rl-phone { position: relative; width: 46px; height: 78px; border: 5px solid #fff; border-radius: 12px; animation: rotatePhone 2s ease-in-out infinite; }
.rl-phone::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 12px; height: 3px; margin-left: -6px; border-radius: 2px; background: #fff; }
.rl-title { margin: 6px 0 0; font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; text-shadow: 3px 3px 0 var(--orange); }
.rl-text { margin: 0; font-size: 17px; font-weight: 700; color: rgba(255,255,255,.8); }

@keyframes drain { from { width: 100%; } to { width: 0; } }
@keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(62,224,127,.7); } 100% { box-shadow: 0 0 0 8px rgba(62,224,127,0); } }
@keyframes countUp { 0% { transform: scale(1); } 35% { transform: scale(1.75) translateY(-3px); text-shadow: 0 0 18px rgba(255,255,255,.9); } 100% { transform: scale(1); } }
@keyframes overtake {
  0%   { outline: 3px solid rgba(255,143,69,1); outline-offset: 0; filter: brightness(1.45); }
  100% { outline: 3px solid rgba(255,143,69,0); outline-offset: 12px; filter: brightness(1); }
}
@keyframes upArrow { 0% { opacity: 0; transform: translate(-50%, 8px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -10px); } }
@keyframes rowIn { from { opacity: 0; transform: translateX(-24px); } }
@keyframes rotatePhone { 0%, 25% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0deg); } }
@media (prefers-reduced-motion: reduce) {
  .st i, .rank-status.st-live i, .rl-phone { animation: none; }
}

/* Telas baixas (iPhone SE etc.) */

}

  .cup-wrap.ready, .slider-text .arrows, .cup-wrap.foamy .foam-inner { animation: none; }
}

      return raw == null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  },
  set(key, value) {
    try {
      if (value == null) localStorage.removeItem(STORAGE_PREFIX + key);
      else localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
    } catch (e) { /* modo privado / sem espaço: segue só em memória */ }
  },
};

function loadState() {
  state.profile = storage.get("profile", null);

  state.screen = storage.get("screen", "start");

  if (state.rankFilter !== null && !Array.isArray(state.rankFilter)) state.rankFilter = null;
  if (state.session && !state.session.id) state.session.id = newId();
}

function saveState() {
  storage.set("profile", state.profile);

  storage.set("result", state.result);
  storage.set("ranking", state.localRanking);
  storage.set("demoHidden", state.demoHidden || null);
  storage.set("rankFilter", state.rankFilter);
  storage.set("outbox", state.outbox.length ? state.outbox : null);
  storage.set("screen", state.screen);
}

const svgUrl = (svg) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);

function iconCanvas(size, opts) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement("canvas");
        c.width = c.height = size;
        c.getContext("2d").drawImage(img, 0, 0, size, size);
        resolve(c);
      } catch (e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = svgUrl(appIconSVG(opts));
  });
}

// Favicon sempre em SVG. Hospedado (GitHub Pages): manifest e ícones vêm dos arquivos PNG.
// Arquivo aberto solto (sem esses arquivos): gera apple-touch-icon e manifest aqui mesmo.
function setupIcons() {
  $("#favicon").setAttribute("href", svgUrl(appIconSVG({ rounded: true })));
  if (/^https?:$/.test(location.protocol)) {
    fetch("manifest.webmanifest", { method: "HEAD", cache: "no-store" })
      .then((r) => { if (!r.ok) generateIcons(); })
      .catch(generateIcons);
  } else {
    generateIcons();
  }
}

function generateIcons() {
  Promise.all([iconCanvas(180), iconCanvas(192), iconCanvas(512), iconCanvas(512, { maskable: true })])
    .then(([c180, c192, c512, cMask]) => {
      const png = (c) => { try { return c ? c.toDataURL("image/png") : null; } catch (e) { return null; } };
      const [p180, p192, p512, pMask] = [png(c180), png(c192), png(c512), png(cMask)];
      if (p180) $("#appleIcon").setAttribute("href", p180);
      if (!p192 || !p512) return;
      try {
        const base = location.href.split("#")[0].split("?")[0];
        const manifest = {
          name: "PORRADINHA · República Rapina",
          short_name: "Porradinha",
          start_url: base,
          scope: base.replace(/[^/]*$/, ""),
          display: "standalone",
          orientation: "portrait",
          background_color: COLORS.navyDark,
          theme_color: COLORS.navy,
          icons: [
            { src: p192, sizes: "192x192", type: "image/png", purpose: "any" },
            { src: p512, sizes: "512x512", type: "image/png", purpose: "any" },
            pMask && { src: pMask, sizes: "512x512", type: "image/png", purpose: "maskable" },
          ].filter(Boolean),
        };
        $("#manifestLink").setAttribute("href", URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" })));
      } catch (e) { /* ambiente sem Blob URL: segue sem manifest */ }
    });
}

/* ============================== PROFILE ============================== */
function cleanText(value, max) {
  return String(value || "").replace(/\s+/g, " ").trim().slice(0, max);
}

function normalizeKey(value) {
  return String(value || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim().toLowerCase();
}

function privilegedFor(nick) {
  const key = normalizeKey(nick);
  return Object.prototype.hasOwnProperty.call(PRIVILEGED_PROFILES, key) ? PRIVILEGED_PROFILES[key] : null;
}

function hasPermission(permission) {
  const p = state.profile;
  return !!(p && Array.isArray(p.permissions) && p.permissions.includes(permission) && privilegedFor(p.nick));
}

function profileBadge() {
  const p = state.profile;
  const privileged = p && privilegedFor(p.nick);
  return privileged && Array.isArray(p.permissions) && p.permissions.length ? privileged.badge : "";
}

function showFieldError(fieldId, errorId, message) {
  const field = $("#" + fieldId);
  field.classList.remove("has-error");
  void field.offsetWidth;
  field.classList.add("has-error");
  $("#" + errorId).textContent = message;
}

function clearFieldError(fieldId, errorId) {
  $("#" + fieldId).classList.remove("has-error");
  $("#" + errorId).textContent = "";
}

// Campo de senha aparece só quando o apelido digitado é de um perfil com permissões
function syncPasswordField() {
  const show = !!privilegedFor($("#inNick").value);
  $("#fieldPass").hidden = !show;
  if (!show) { $("#inPass").value = ""; clearFieldError("fieldPass", "passError"); }
}

function askPassword(nick) {
  return openSheet({
    emoji: "🔒", title: "SENHA",
    text: `${nick} é um perfil com permissões. Digite a senha para continuar.`,
    input: {
      type: "password", placeholder: "••••••••", max: 40,
      validate: (v) => (!v ? "Digite a senha." : null),
      check: async (v) => { // conferida no servidor
        if (!ONLINE) return "Esse perfil precisa de conexão com o servidor.";
        try {
          return (await rpc("claim_admin", { p_nick: nick, p_password: v })) ? null : "Senha incorreta. Confere e tenta de novo.";
        } catch (e) { return friendlyError(e); }
      },
    },
    buttons: [{ label: "ENTRAR", value: "ok" }, { label: "CANCELAR", value: null, style: "ghost" }],
  }).then((res) => !!(res && res.value === "ok"));
}

function startSession(nick, org, permissions, row) {
  state.profile = { nick, org, permissions: permissions || [] };
  state.session = {
    id: newId(), remoteId: row ? row.id : null, remoteSince: Date.now(),
    count: 0, lastAt: null, startedAt: Date.now(), dirty: false,
  };
  if (row) server.rows.set(row.id, row);
  state.result = null;
  saveState();
  go("main");
}

async function onStartSubmit(event) {
  event.preventDefault();
  const nick = cleanText($("#inNick").value, NICK_MAX);
  const org = cleanText($("#inOrg").value, ORG_MAX);
  if (!nick) {
    showFieldError("fieldNick", "nickError", "Coloca seu apelido pra começar.");
    $("#inNick").focus();
    return;
  }
  clearFieldError("fieldNick", "nickError");

  // Perfil com permissões (ex.: Tatu) só avança com a senha certa, conferida no servidor
  const privileged = privilegedFor(nick);
  const pass = $("#inPass").value;
  const passProblem = (message) => {
    $("#fieldPass").hidden = false;
    showFieldError("fieldPass", "passError", message);
    $("#inPass").focus();
  };
  if (privileged && !pass) return passProblem(`O perfil ${nick} precisa de senha.`);
  if (privileged && !ONLINE) return passProblem("Esse perfil precisa de conexão com o servidor.");
  clearFieldError("fieldPass", "passError");

  let row = null;
  if (ONLINE) {
    if (startBusy) return;
    setStartBusy(true);
    try {
      if (privileged) {
        const ok = await rpc("claim_admin", { p_nick: nick, p_password: pass });
        if (!ok) return passProblem("Senha incorreta. Confere e tenta de novo.");
      } else {
        rpc("release_admin", {}).catch(() => {});
      }
      row = await rpc("start_participant", { p_nick: nick, p_org: org });
    } catch (e) {
      if (privileged) passProblem(friendlyError(e));
      else showFieldError("fieldNick", "nickError", friendlyError(e));
      return;
    } finally {
      setStartBusy(false);
    }
  }
  $("#inPass").value = "";
  if (document.activeElement) document.activeElement.blur();
  startSession(nick, org, privileged ? privileged.permissions.slice() : [], row);
}

let startBusy = false;

}

/* ============================== COUNTER ============================== */
function tryDrink() {
  if (state.screen !== "main" || state.animating || !state.session) return;
  if (cooldownLeft() > 0) { openCooldownSheet(); return; }

  // Conta e inicia o cooldown já no toque (antes da animação) — evita toque duplo
  // e mantém a contagem certa mesmo se a página for recarregada no meio.
  state.session.count += 1;
  state.session.lastAt = Date.now();
  saveState();
  markDirty(); // online: manda para o servidor (e reenvia sozinho se estiver sem sinal)
  playPorradinha(state.session.count);
}

function renderCounter(value, bump) {
  const num = $("#countNum");
  num.textContent = value;
  $("#countLabel").textContent = value === 1 ? "PORRADINHA" : "PORRADINHAS";
  if (bump) { num.classList.remove("bump"); void num.offsetWidth; num.classList.add("bump"); }
}

async function resetCounter() {
  const res = await openSheet({
    emoji: "🧽", title: "ZERAR CONTADOR?",
    text: `Sua contagem de ${state.session.count} volta para 0. Não dá pra desfazer.`,
    buttons: [{ label: "ZERAR", value: "ok", style: "danger" }, { label: "CANCELAR", value: null, style: "ghost" }],
  });
  if (!res || res.value !== "ok") return;
  state.session.count = 0;
  state.session.lastAt = null;
  saveState();
  markDirty();
  renderMain();
  setFill(1, 300);
}

/* ============================== COOLDOWN ============================== */
function cooldownLeftMs() {
  if (!state.session || !state.session.lastAt) return 0;
  const left = state.session.lastAt + COOLDOWN_SECONDS * 1000 - Date.now();
  return Math.max(0, Math.min(COOLDOWN_SECONDS * 1000, left)); // min() protege contra relógio alterado
}
function cooldownLeft() { return Math.ceil(cooldownLeftMs() / 1000); }
function cooldownProgress() { return 1 - cooldownLeftMs() / (COOLDOWN_SECONDS * 1000); }

function openCooldownSheet() {
  vibrate([30, 40, 30]);
  openSheet({
    title: "VAI PRO FINAL DA FILA 😅",
    text: "Porradinha é pra todo mundo aproveitar.",
    html: `<div class="big-timer">Próxima em <b data-cooldown-left>${cooldownLeft()}</b> segundos</div>`,
    signed: true,
    buttons: [{ label: "BELEZA", value: "ok", style: "white" }],
    kind: "cooldown",
  });
}

// Atualiza tudo que depende do relógio (roda a cada 250 ms).
function tick() {
  if (state.screen === "main" && state.session) {
    const left = cooldownLeft();
    const btn = $("#drinkBtn");
    btn.classList.toggle("is-cooling", left > 0 || state.animating);
    const noSignal = ONLINE && state.session.dirty && server.offlineSince && Date.now() - server.offlineSince > 4000;
    $("#coolLine").innerHTML = state.animating ? ""
      : left > 0 ? `Próxima em <b>${left}s</b>${noSignal ? " · sem sinal" : ""}`
      : noSignal ? "📶 Sem sinal: sua contagem sobe quando a internet voltar" : "";
    if (!state.animating) {
      setFill(cooldownProgress(), 300); // o copo "reenche" durante o cooldown
      $("#cupWrap").classList.toggle("ready", left === 0);
    }
    document.querySelectorAll("[data-cooldown-left]").forEach((el) => { el.textContent = left; });
    if (left === 0 && layerKind() === "cooldown") closeSheet(null);
  }
  if (state.screen === "result") updateUndo();
  // tempo real caiu: enquanto não volta, atualiza o ranking a cada 15 s
  if (ONLINE && state.screen === "ranking" && !server.live && Date.now() - server.lastFetch > 15000) fetchRanking();
}

/* ============================== CHECKPOINTS ============================== */
function showCheckpoint(count) {
  const cp = CHECKPOINTS[count];
  if (!cp) return;
  if (cp.important) {
    openSheet({
      emoji: cp.emoji || "💧", title: `${count} PORRADINHAS`, text: cp.text,
      buttons: [{ label: "ENTENDI", value: "ok", style: "white" }], lockBackdrop: true, signed: true,
    });
  } else {
    toast(cp.text, 4200, { signed: true });
  }
}

/* ============================== ANIMATIONS ============================== */
function vibrate(pattern) { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {} }

function restartClass(el, cls) {
  el.classList.remove(cls);
  void el.getBoundingClientRect(); // força reflow para a animação recomeçar
  el.classList.add(cls);
}

// Nível do líquido no copo: 0 (vazio) a 1 (cheio).
function setFill(value, ms) {
  const liquid = $("#liquid");
  liquid.style.transition = `transform ${Math.round(ms)}ms ${ms > 400 ? "ease-in" : "linear"}`;
  liquid.style.setProperty("--fill", Math.max(0, Math.min(1, value)).toFixed(3));
}

// 1, 2, 3, PORRADINHA! → desce → bate na mesa → treme → borbulha → espuma → vira → volta
async function playPorradinha(count) {
  state.animating = true;
  const k = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.55 : 1;
  const wrap = $("#cupWrap"), overlay = $("#countdown"), text = $("#cdText"), impact = $("#impact");
  wrap.classList.remove("ready");
  tick();
  setFill(1, 0);

  overlay.hidden = false;
  for (const n of ["1", "2", "3"]) {
    text.className = "cd-text"; text.textContent = n;
    restartClass(text, "pop"); vibrate(15);
    await wait(TIMING.countStep * k);
  }
  text.className = "cd-text word"; text.textContent = "PORRADINHA!";
  restartClass(text, "pop");
  await wait(TIMING.word * k);
  overlay.hidden = true;

  restartClass(wrap, "slam");                       // copo sobe e desce com tudo
  await wait(TIMING.slam * k);
  wrap.classList.remove("slam");

  restartClass(wrap, "shake");                      // impacto na mesa
  restartClass(impact, "go");
  vibrate(70);
  wrap.classList.add("bubbling");                   // líquido borbulha
  await wait(TIMING.shake * k);
  wrap.classList.remove("shake");

  wrap.classList.add("foamy");                      // espuma sobe e transborda
  await wait(TIMING.foam * k);

  restartClass(wrap, "drink");                      // vira o copo
  await wait(TIMING.drink * 0.25 * k);
  wrap.classList.remove("foamy", "bubbling");
  setFill(0, TIMING.drink * 0.45 * k);
  await wait(TIMING.drink * 0.75 * k);
  wrap.classList.remove("drink");                   // volta à posição
  impact.classList.remove("go");

  state.animating = false;
  if (state.screen !== "main") return;
  renderCounter(count, true);
  tick();
  showCheckpoint(count);
}

/* ============================== UI: sheets, menu, toast ============================== */
let sheetCtx = null; // { resolve, kind, lockBackdrop, el }

// Diálogo em "bottom sheet" (fácil de usar com uma mão). Resolve { value, text } ou null.
function openSheet(opts) {
  if (sheetCtx) closeSheet(null);
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    const sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.setAttribute("role", "dialog");
    sheet.setAttribute("aria-modal", "true");
    overlay.appendChild(sheet);

    const add = (tag, cls, txt) => {
      const el = document.createElement(tag);
      if (cls) el.className = cls;
      if (txt != null) el.textContent = txt;
      sheet.appendChild(el);
      return el;
    };
    if (opts.emoji) add("div", "emoji", opts.emoji);
    if (opts.title) add("h2", "", opts.title);
    if (opts.text) add("p", "", opts.text);
    if (opts.html) sheet.insertAdjacentHTML("beforeend", opts.html); // só HTML interno, nunca texto do usuário
    if (opts.node) sheet.appendChild(opts.node);

    let input = null, error = null;
    if (opts.input) {
      const isPassword = opts.input.type === "password";
      input = add("input");
      input.type = isPassword ? "password" : "text";
      input.maxLength = opts.input.max || 40;
      input.value = opts.input.value || "";
      input.placeholder = opts.input.placeholder || "";
      input.autocapitalize = isPassword ? "off" : "words";
      input.autocomplete = "off";
      input.spellcheck = false;
      error = add("div", "field-error");
    }
    if (opts.signed) add("div", "signature", SIGNATURE);

    let checking = false;
    const submit = async (value) => {
      if (value == null) return closeSheet(null);
      if (checking) return;
      const txt = input ? cleanText(input.value, opts.input.max || 40) : undefined;
      let problem = !input ? null
        : opts.input.required && !txt ? opts.input.required
        : opts.input.validate ? opts.input.validate(input.value) : null;
      if (!problem && input && opts.input.check) { // conferência demorada (ex.: senha no servidor)
        checking = true;
        sheet.querySelectorAll(".actions .btn").forEach((b) => { b.disabled = true; });
        try { problem = await opts.input.check(input.value); }
        finally {
          checking = false;
          sheet.querySelectorAll(".actions .btn").forEach((b) => { b.disabled = false; });
        }
        if (!sheetCtx || sheetCtx.el !== overlay) return;
      }
      if (problem) {
        error.textContent = problem;
        input.style.animation = "shake .35s"; setTimeout(() => (input.style.animation = ""), 360);
        input.focus();
        return;
      }
      closeSheet({ value, text: txt });
    };

    const actions = add("div", "actions");
    (opts.buttons || []).forEach((b) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn" + (b.style ? " btn-" + b.style : "");
      btn.textContent = b.label;
      btn.addEventListener("click", () => submit(b.value));
      actions.appendChild(btn);
    });

    if (input) {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); submit(opts.buttons[0].value); }
      });
      input.addEventListener("input", () => { error.textContent = ""; });
    }
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay && sheetCtx && sheetCtx.el === overlay && !sheetCtx.lockBackdrop) closeSheet(null);
    });

    sheetCtx = { resolve, kind: opts.kind || null, lockBackdrop: !!opts.lockBackdrop, el: overlay };
    $("#layer").appendChild(overlay);
    if (opts.onMount) opts.onMount(sheet);
    if (input) setTimeout(() => input.focus(), 60);
  });
}

function closeSheet(result) {
  if (!sheetCtx) return;
  const ctx = sheetCtx;
  sheetCtx = null;
  ctx.el.remove();
  ctx.resolve(result);
}

function layerKind() { return sheetCtx ? sheetCtx.kind : null; }

let toastTimer = null;
function toast(message, ms = 4200, { signed = false } = {}) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const el = document.createElement("div");
  el.className = "toast";
  el.setAttribute("role", "status");
  el.textContent = message;
  if (signed) {
    const sign = document.createElement("div");
    sign.className = "toast-sign";
    sign.textContent = SIGNATURE;
    el.appendChild(sign);
  }
  const hide = () => { el.classList.add("out"); setTimeout(() => el.remove(), 260); };
  el.addEventListener("click", hide);
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hide, ms);
}

function openMenu() {
  if (state.animating) return;
  const list = document.createElement("div");
  list.className = "menu-list";
  const items = [
    ["✏️", "Trocar apelido", changeNick],
    ["🏠", "Alterar República / Atlética / Organização", changeOrg],
    ["🏆", "Ranking ao vivo", () => go("ranking")],

  ];

    const t = document.createElement("span"); t.textContent = label;
    item.append(i, t);
    item.addEventListener("click", () => { closeSheet(null); action(); });

  openSheet({ title: "MENU", node: list, buttons: [{ label: "FECHAR", value: null, style: "ghost" }] });

/* ============================== FINALIZAR (slider + confirmação) ============================== */
function initSlider() {
  const slider = $("#finishSlider"), thumb = $("#sliderThumb"), fill = $("#sliderFill");
  const PAD = 4;
  let dragging = false, pointerId = null, startX = 0, x = 0, max = 0;

  const setX = (value) => {
    x = Math.max(0, Math.min(max, value));
    thumb.style.transform = `translateX(${x}px)`;
    fill.style.width = (x ? x + thumb.offsetWidth + PAD : 0) + "px";
    slider.style.setProperty("--p", max ? (x / max).toFixed(3) : 0);
  };

  thumb.addEventListener("pointerdown", (e) => {
    if (state.animating) return;
    e.preventDefault();
    dragging = true;
    pointerId = e.pointerId;
    slider.classList.remove("returning", "nudge");
    max = slider.clientWidth - thumb.offsetWidth - PAD * 2;
    startX = e.clientX - x;
    try { thumb.setPointerCapture(e.pointerId); } catch (err) {}
  });
  thumb.addEventListener("pointermove", (e) => {
    if (dragging && e.pointerId === pointerId) setX(e.clientX - startX);
  });
  const end = async () => {
    if (!dragging) return;
    dragging = false;
    const reachedEnd = max > 0 && x >= max * 0.9;
    slider.classList.add("returning");
    if (reachedEnd) {
      setX(max);
      vibrate(30);
      await confirmFinish();
    }
    setX(0);
  };
  thumb.addEventListener("pointerup", end);
  thumb.addEventListener("pointercancel", end);
  thumb.addEventListener("lostpointercapture", end);

  // Toque sem arrastar => só uma dica
  slider.addEventListener("click", () => {
    if (x !== 0 || dragging || sheetCtx) return;
    restartClass(slider, "nudge");
    toast("Arraste até o fim para finalizar ›››", 2200);
  });
  thumb.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); confirmFinish(); }
  });
}

async function confirmFinish() {
  if (state.animating || !state.session || state.screen !== "main") return;
  const n = state.session.count;
  const res = await openSheet({
    emoji: "🏁",
    title: "FINALIZAR SUA CONTAGEM?",
    text: `Parou mesmo de tomar Porradinha por hoje? Seu resultado (${n} ${n === 1 ? "Porradinha" : "Porradinhas"}) vai para o card final e para o ranking.`,
    buttons: [
      { label: "SIM, PAREI POR HOJE", value: "ok" },
      { label: "AINDA NÃO", value: null, style: "ghost" },
    ],
  });
  if (res && res.value === "ok") finishSession();
}

/* ============================== RESULT ============================== */
function finishSession() {
  const result = {
    id: state.session.remoteId || state.session.id || newId(), // mesmo id da contagem: no ranking a linha só troca de status
    nick: state.profile.nick,
    org: state.profile.org || "",
    count: state.session.count,
    lastAt: state.session.lastAt || 0,
    finishedAt: Date.now(),
  };
  state.result = result;
  if (!ONLINE) state.localRanking.push({ ...result }); // offline: entra no ranking local
  saveState();
  markDirty(); // online: status "finalizou" vai para o servidor
  go("result");
}

function renderResult() {
  const r = state.result;
  if (!r) return;
  $("#scNick").textContent = r.nick;
  const org = $("#scOrg");
  org.textContent = r.org;
  org.hidden = !r.org;
  const num = $("#scNum");
  num.textContent = r.count;
  num.classList.toggle("d3", String(r.count).length >= 3);
  $("#scLabel").textContent = r.count === 1 ? "PORRADINHA" : "PORRADINHAS";
  $("#scHandle").textContent = INSTAGRAM_HANDLE;
  $("#scSign").textContent = SIGNATURE;
  $("#scDate").textContent = new Date(r.finishedAt).toLocaleDateString("pt-BR");
  updateUndo();
}

// "Voltar a tomar": disponível por UNDO_FINISH_SECONDS após finalizar (vale mesmo recarregando).
function undoLeftMs() {
  if (!state.result) return 0;
  const left = state.result.finishedAt + UNDO_FINISH_SECONDS * 1000 - Date.now();
  return Math.max(0, Math.min(UNDO_FINISH_SECONDS * 1000, left));
}

function updateUndo() {
  const box = $("#undoBox");
  const ms = undoLeftMs();
  const show = ms > 0 && !!state.session;
  box.hidden = !show;
  if (!show) return;
  $("#undoBar").style.width = ((ms / (UNDO_FINISH_SECONDS * 1000)) * 100).toFixed(1) + "%";
  $("#undoLeft").textContent = `${Math.ceil(ms / 1000)} s para voltar`;
}

function undoFinish() {
  if (!state.result || !state.session || undoLeftMs() <= 0) return;
  const id = state.result.id;
  state.localRanking = state.localRanking.filter((e) => e.id !== id); // tira do ranking
  state.result = null;
  saveState();
  markDirty(); // online: volta a "tomando" no servidor
  go("main");
  toast("Contagem reaberta de onde parou.", 2600);
}

/* ============================== RANKING ============================== */
// RANKING LOCAL / DEMO: DEFAULT_RANKING + quem está contando agora neste aparelho + resultados
// finalizados aqui. "Ao vivo" só entre abas do mesmo aparelho (evento "storage").
// Na versão com Supabase, getRankingEntries() lê do banco e as mudanças chegam pelo tempo real.
function getRankingEntries() {
  if (ONLINE) return getServerRankingEntries();
  const entries = state.demoHidden ? [] : DEFAULT_RANKING.map((e, i) => ({
    id: "demo-" + i, nick: e.nick, org: e.org || "", count: e.count,
    status: e.status === "drinking" ? "drinking" : "finished", lastAt: 0, demo: true,
  }));
  state.localRanking.forEach((e) => entries.push({
    ...e, org: e.org || "", status: "finished", lastAt: e.lastAt || e.finishedAt || 0,
  }));
  if (state.profile && state.session && !state.result) {
    entries.push({
      id: state.session.id, nick: state.profile.nick, org: state.profile.org || "",
      count: state.session.count, status: "drinking",
      lastAt: state.session.lastAt || state.session.startedAt || 0,
    });
  }
  return entries.sort((a, b) => b.count - a.count || a.lastAt - b.lastAt);
}

// Agrupa as repúblicas sem diferenciar maiúsculas/acentos ("Rapina" = "RAPINA").
function getOrgOptions(entries) {
  const map = new Map();
  entries.forEach((e) => {
    const key = normalizeKey(e.org);
    if (!map.has(key)) map.set(key, { key, label: e.org || "Sem república", count: 0 });
    map.get(key).count += 1;
  });
  return [...map.values()].sort((a, b) => (a.key === "") - (b.key === "") || a.label.localeCompare(b.label, "pt-BR"));
}

function selectedOrgKeys(options) {
  return Array.isArray(state.rankFilter) ? new Set(state.rankFilter) : new Set(options.map((o) => o.key));
}

function setRankFilter(keys, options) {
  state.rankFilter = options.every((o) => keys.has(o.key)) ? null : [...keys];
  storage.set("rankFilter", state.rankFilter);
  renderRanking();
}

function openFilterSheet() {
  const options = getOrgOptions(getRankingEntries());
  if (!options.length) return;
  const selected = selectedOrgKeys(options);
  const myKey = normalizeKey((state.result && state.result.org) || (state.profile && state.profile.org) || "");
  const mine = myKey ? options.find((o) => o.key === myKey) : null;

  const wrap = document.createElement("div");
  const quick = document.createElement("div");
  quick.className = "filter-quick";
  const list = document.createElement("div");
  list.className = "check-list";
  const inputs = [];

  const apply = () => setRankFilter(new Set(inputs.filter((i) => i.checked).map((i) => i.value)), options);
  const setAll = (isOn) => { inputs.forEach((i) => { i.checked = isOn(i.value); }); apply(); };
  const pill = (label, onClick) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pill-btn";
    b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  };
  quick.append(pill("Selecionar todas", () => setAll(() => true)), pill("Limpar seleção", () => setAll(() => false)));
  if (mine) quick.append(pill(`Só a minha: ${mine.label}`, () => setAll((k) => k === myKey)));

  options.forEach((o) => {
    const row = document.createElement("label");
    row.className = "check-row";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.value = o.key;
    input.checked = selected.has(o.key);
    input.addEventListener("change", apply);
    const box = document.createElement("span");
    box.className = "check-box";
    box.textContent = "✓";
    const label = document.createElement("span");
    label.className = "check-label";
    label.textContent = o.label;
    const count = document.createElement("span");
    count.className = "check-count";
    count.textContent = `${o.count} ${o.count === 1 ? "pessoa" : "pessoas"}`;
    row.append(input, box, label, count);
    list.appendChild(row);
    inputs.push(input);
  });
  wrap.append(quick, list);

  openSheet({
    title: "FILTRAR REPÚBLICAS",
    text: "Marque as repúblicas que aparecem no ranking.",
    node: wrap,
    buttons: [{ label: "VER RANKING", value: "ok", style: "white" }],
  });
}

async function resetRanking() {
  if (!hasPermission("resetRanking")) return;
  const total = ONLINE
    ? getRankingEntries().length
    : getRankingEntries().filter((e) => e.status === "finished" || e.demo).length;
  const where = ONLINE ? "de todo mundo (inclusive a sua contagem)" : "deste aparelho";
  const res = await openSheet({
    emoji: "🧨", title: "ZERAR RANKING GERAL?",
    text: total
      ? `Apaga ${total} ${total === 1 ? "resultado" : "resultados"} ${where}, inclusive os de demonstração. O ranking recomeça do zero e não dá pra desfazer.`
      : "O ranking já está zerado.",
    buttons: total
      ? [{ label: "ZERAR RANKING", value: "ok", style: "danger" }, { label: "CANCELAR", value: null, style: "ghost" }]
      : [{ label: "OK", value: null, style: "white" }],
  });
  if (!res || res.value !== "ok") return;
  if (ONLINE) {
    try { await rpc("reset_ranking", {}); }
    catch (e) { toast(friendlyError(e), 3200); return; }
    server.rows.clear();
    handleRemoteReset(true);
  }
  state.localRanking = [];
  state.demoHidden = true;
  state.rankFilter = null;
  saveState();
  if (state.screen === "ranking") renderRanking();
  toast("Ranking zerado. Começando do zero.", 2600);
}

function withPositions(entries) {
  let prevCount = null, prevPos = 0;
  return entries.map((e, i) => {
    const pos = e.count === prevCount ? prevPos : i + 1; // empates dividem a posição
    prevCount = e.count;
    prevPos = pos;
    return { ...e, pos };
  });
}

const MEDALS = { 1: "🥇", 2: "🥈", 3: "🥉" };

function renderRanking({ animate = false } = {}) {
  const list = $("#rankList");
  const before = new Map(); // posição anterior de cada linha, para animar mudanças ao vivo
  if (animate) {
    list.querySelectorAll(".rank-row[data-id]").forEach((row) => {
      before.set(row.dataset.id, { top: row.getBoundingClientRect().top, count: Number(row.dataset.count), pos: Number(row.dataset.pos) });
    });
  }
  list.innerHTML = "";
  const meId = state.session ? (state.session.remoteId || state.session.id) : null;
  $("#rankSub").textContent = !ONLINE ? "Resultados registrados neste dispositivo"
    : server.live ? "Ao vivo com todo mundo da festa" : "Conectando ao ranking ao vivo…";

  const entries = getRankingEntries();
  const options = getOrgOptions(entries);
  const selected = selectedOrgKeys(options);
  const visible = withPositions(entries.filter((e) => selected.has(normalizeKey(e.org))));

  // Botão do filtro
  const chosen = options.filter((o) => selected.has(o.key));
  const filtered = chosen.length !== options.length;
  $("#filterBtn").classList.toggle("is-filtered", filtered);
  $("#filterBtn").disabled = options.length === 0;
  $("#filterValue").textContent = options.length === 0 ? "—"
    : !filtered ? `Todas (${options.length})`
    : chosen.length === 0 ? "Nenhuma"
    : chosen.length === 1 ? chosen[0].label
    : `${chosen.length} de ${options.length}`;

  // Legenda: ainda tomando x finalizaram
  const drinking = visible.filter((e) => e.status === "drinking").length;
  const done = visible.length - drinking;
  $("#rankLegend").innerHTML =
    `<span class="st"><i></i>${drinking} ainda tomando</span>` +
    `<span class="st">🏁 ${done} ${done === 1 ? "finalizou" : "finalizaram"}</span>`;

  if (!visible.length) {
    const empty = document.createElement("li");
    empty.className = "rank-empty";
    empty.textContent = entries.length
      ? "Nenhuma república selecionada. Toque em REPÚBLICAS para escolher."
      : "Ranking zerado. Quem começar a contar aparece aqui.";
    list.appendChild(empty);
  }

  let dividerAdded = false;
  visible.forEach((e) => {
    if (e.pos > 3 && !dividerAdded) {
      dividerAdded = true;
      const d = document.createElement("li");
      d.className = "rank-divider";
      d.textContent = "DEMAIS RESULTADOS";
      list.appendChild(d);
    }
    const isMe = e.id === meId;
    const li = document.createElement("li");
    li.className = "rank-row" + (e.pos <= 3 ? " p" + e.pos : "") + (isMe ? " me" : "");
    li.dataset.id = e.id;
    li.dataset.count = e.count;
    li.dataset.pos = e.pos;

    const pos = document.createElement("div");
    pos.className = "rank-pos";
    if (e.pos <= 3) pos.innerHTML = `<span class="rank-medal">${MEDALS[e.pos]}</span><span class="rank-place">${e.pos}º LUGAR</span>`;
    else pos.textContent = e.pos + "º";

    const info = document.createElement("div");
    info.className = "rank-info";
    const nick = document.createElement("div");
    nick.className = "rank-nick";
    nick.textContent = e.nick;
    const org = document.createElement("div");
    org.className = "rank-org";
    if (isMe) {
      const tag = document.createElement("span");
      tag.className = "you-tag";
      tag.textContent = "VOCÊ";
      org.appendChild(tag);
    }
    org.appendChild(document.createTextNode(e.org || "—"));
    const status = document.createElement("div");
    status.className = "rank-status " + (e.status === "drinking" ? "st-live" : "st-done");
    status.innerHTML = e.status === "drinking" ? "<i></i>TOMANDO" : "🏁 FINALIZOU";
    info.append(nick, org, status);

    const qty = document.createElement("div");
    qty.className = "rank-qty";
    const num = document.createElement("span");
    num.className = "rank-num";
    num.textContent = e.count;
    qty.appendChild(num);
    const small = document.createElement("small");
    small.textContent = e.count === 1 ? "Porradinha" : "Porradinhas";
    qty.appendChild(small);

    li.append(pos, info, qty);
    list.appendChild(li);
  });

  // Ao vivo: quem passou alguém desliza para cima e ganha destaque; número que subiu dá um zoom
  if (animate) {
    list.querySelectorAll(".rank-row[data-id]").forEach((row) => {
      const prev = before.get(row.dataset.id);
      if (!prev) { row.classList.add("is-new"); return; }
      const dy = prev.top - row.getBoundingClientRect().top;
      if (Math.abs(dy) > 1) {
        row.style.transition = "none";
        row.style.transform = `translateY(${dy}px)`;
        requestAnimationFrame(() => requestAnimationFrame(() => {
          row.style.transition = "transform .7s cubic-bezier(.2,.9,.25,1)";
          row.style.transform = "";
        }));
      }
      if (Number(row.dataset.pos) < prev.pos) row.classList.add("overtake");
      if (Number(row.dataset.count) > prev.count) row.querySelector(".rank-num").classList.add("count-up");
    });
  }

  $("#rankBackBtn").textContent = state.result ? "VOLTAR AO RESULTADO" : state.session ? "VOLTAR PRA CONTAGEM" : "VOLTAR";
  $("#endBtn").hidden = !state.result;
  $("#resetRankingBtn").hidden = !hasPermission("resetRanking");
  const me = list.querySelector(".me");
  if (me && !animate) requestAnimationFrame(() => {
    if (me.getBoundingClientRect().bottom > window.innerHeight - 170) me.scrollIntoView({ block: "center" });
  });
}

function rankingBack() {
  go(state.result ? "result" : state.session ? "main" : "start");
}

/* ============================== SERVER (Supabase) ============================== */
// Cada celular entra com um login anônimo (sem cadastro). O ranking vem da tabela "participants"
// e as mudanças chegam pelo tempo real. Gravar só pelas funções do banco (ver 01-porradinha.sql).
const ONLINE = !!(SUPABASE_URL && SUPABASE_KEY);
const server = {
  client: null,
  libPromise: null,
  authPromise: null,
  channel: null,
  rows: new Map(),   // ranking vindo do banco: id → linha
  live: false,       // tempo real conectado
  lastFetch: 0,
  offlineSince: 0,   // desde quando as gravações estão falhando
};

const SERVER_ERRORS = {
  nick_reservado: "Esse apelido é de um perfil com permissões.",
  apelido_obrigatorio: "Coloca seu apelido pra começar.",
  aguarde: "Espera uns segundinhos e tenta de novo.",
  sem_permissao: "Só perfil com permissões pode fazer isso.",
  participante_nao_encontrado: "Sua contagem não está mais no ranking.",
};

function errorCode(e) { return String((e && (e.message || e.error_description || e.code)) || e || ""); }

function friendlyError(e) {
  const code = errorCode(e);
  const known = Object.keys(SERVER_ERRORS).find((k) => code.indexOf(k) !== -1);
  if (known) return SERVER_ERRORS[known];
  if (/anonymous|not allowed|rate limit|too many/i.test(code)) return "O servidor recusou a entrada agora. Tenta de novo em instantes.";
  return "Sem conexão com o servidor. Confere a internet e tenta de novo.";
}

function withTimeout(promise, ms) {
  let timer;
  const limit = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error("timeout")), ms); });
  return Promise.race([promise, limit]).finally(() => clearTimeout(timer));
}

function loadSupabaseLib() {
  if (window.supabase) return Promise.resolve();
  if (!server.libPromise) {
    server.libPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = SUPABASE_JS;
      s.onload = () => (window.supabase ? resolve() : reject(new Error("sem_biblioteca")));
      s.onerror = () => reject(new Error("sem_biblioteca"));
      document.head.appendChild(s);
    }).catch((e) => { server.libPromise = null; throw e; });
  }
  return server.libPromise;
}

function sb() {
  if (!server.client && window.supabase) {
    server.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: STORAGE_PREFIX + "auth" },
    });
  }
  return server.client;
}

async function ensureAuth() {
  await loadSupabaseLib();
  const client = sb();
  if (!server.authPromise) {
    server.authPromise = (async () => {
      const { data } = await client.auth.getSession();
      if (data && data.session) return data.session;
      const res = await client.auth.signInAnonymously();
      if (res.error) throw res.error;
      return res.data.session;
    })().catch((e) => { server.authPromise = null; throw e; });
  }
  return withTimeout(server.authPromise, 15000);
}

async function rpc(name, args) {
  await ensureAuth();
  const { data, error } = await withTimeout(sb().rpc(name, args), 15000);
  if (error) throw error;
  return data;
}

const parseTs = (v) => (v ? Date.parse(String(v).replace(/(\.\d{3})\d+/, "$1")) || 0 : 0);

// Ranking online: linhas do banco + a minha contagem por cima (a tela nunca espera a rede).
function getServerRankingEntries() {
  const s = state.session;
  const mineId = s ? s.remoteId : null;
  const entries = [];
  server.rows.forEach((r) => {
    const mine = !!mineId && r.id === mineId && !!state.profile;
    entries.push({
      id: r.id,
      nick: mine ? state.profile.nick : r.nick,
      org: mine ? state.profile.org || "" : r.org || "",
      count: mine ? s.count : r.porradinhas,
      status: mine ? (state.result ? "finished" : "drinking") : r.status,
      lastAt: mine ? s.lastAt || parseTs(r.created_at) : parseTs(r.last_at || r.created_at),
      demo: !!r.is_demo,
    });
  });
  if (s && state.profile && (!mineId || !server.rows.has(mineId))) {
    entries.push({
      id: mineId || s.id, nick: state.profile.nick, org: state.profile.org || "",
      count: s.count, status: state.result ? "finished" : "drinking", lastAt: s.lastAt || s.startedAt || 0,
    });
  }
  return entries.sort((a, b) => b.count - a.count || a.lastAt - b.lastAt);
}

async function fetchRanking() {
  if (!ONLINE) return;
  const startedAt = Date.now();
  server.lastFetch = startedAt;
  try {
    await loadSupabaseLib();
    const { data, error } = await withTimeout(
      sb().from("participants")
        .select("id,nick,org,porradinhas,status,last_at,finished_at,is_demo,created_at")
        .order("porradinhas", { ascending: false })
        .limit(2000),
      15000
    );
    if (error) throw error;
    server.rows = new Map(data.map((r) => [r.id, r]));
    const s = state.session;
    if (s && s.remoteId && !server.rows.has(s.remoteId) && (s.remoteSince || 0) < startedAt - 1000) handleRemoteReset();
    scheduleRankingRender();
  } catch (e) { /* sem rede: tenta de novo depois */ }
}

function subscribeRanking() {
  if (!ONLINE || server.channel || !sb()) return;
  server.channel = sb()
    .channel("ranking-porradinha")
    .on("postgres_changes", { event: "*", schema: "public", table: "participants" }, onRankingChange)
    .subscribe((status) => {
      const wasLive = server.live;
      server.live = status === "SUBSCRIBED";
      if (server.live && !wasLive) fetchRanking(); // recupera o que passou enquanto estava desconectado
      if (wasLive !== server.live) scheduleRankingRender();
    });
}

function onRankingChange(payload) {
  if (payload.eventType === "DELETE") {
    const id = payload.old && payload.old.id;
    if (!id) return;
    server.rows.delete(id);
    if (state.session && state.session.remoteId === id) handleRemoteReset();
  } else if (payload.new && payload.new.id) {
    server.rows.set(payload.new.id, payload.new);
  }
  scheduleRankingRender();
}

let rankRenderTimer = null;
function scheduleRankingRender() {
  clearTimeout(rankRenderTimer);
  rankRenderTimer = setTimeout(() => { if (state.screen === "ranking") renderRanking({ animate: true }); }, 120);
}

// Minha linha sumiu do banco = o admin zerou o ranking.
function handleRemoteReset(silent) {
  const s = state.session;
  if (!s || !s.remoteId) return;
  s.remoteId = null;
  s.dirty = false;
  if (state.result) { saveState(); return; } // já tinha finalizado: o card continua
  s.count = 0;
  s.lastAt = null;
  saveState();
  if (state.screen === "main" && !state.animating) renderMain();
  if (!silent) toast("O ranking foi zerado pela organização. Sua contagem recomeçou do zero.", 5000, { signed: true });
  syncSoon(500); // cria a contagem nova no servidor
}

function markDirty() {
  if (!ONLINE || !state.session) return;
  state.session.dirty = true;
  saveState();
  syncSoon();
}

let syncTimer = null, syncing = false, syncDelay = 0;
function syncSoon(delay = 0) {
  if (!ONLINE) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, delay);
}

async function ensureParticipant(s) {
  const row = await rpc("start_participant", { p_nick: state.profile.nick, p_org: state.profile.org || "" });
  if (state.session !== s) return;
  s.remoteId = row.id;
  s.remoteSince = Date.now();
  s.dirty = s.count > 0 || !!state.result;
  server.rows.set(row.id, row);
  saveState();
}

// Envia o que falta para o servidor. Sem sinal: tenta de novo com espera crescente (até 30 s).
async function syncNow() {
  if (!ONLINE || syncing) return;
  syncing = true;
  try {
    while (state.outbox.length) { // contagens já encerradas que não gravaram na hora
      try {
        const row = await rpc("save_progress", state.outbox[0]);
        if (row && row.id) server.rows.set(row.id, row);
      } catch (e) {
        if (errorCode(e).indexOf("participante_nao_encontrado") === -1) throw e;
      }
      state.outbox.shift();
      saveState();
    }
    const s = state.session;
    if (s && state.profile) {
      if (!s.remoteId) await ensureParticipant(s);
      while (state.session === s && s.remoteId && s.dirty) {
        s.dirty = false;
        saveState();
        const row = await rpc("save_progress", {
          p_id: s.remoteId, p_count: s.count, p_status: state.result ? "finished" : "drinking",
        });
        if (row && row.id) server.rows.set(row.id, row);
        if (row && state.session === s && !s.dirty && row.porradinhas < s.count) {
          s.count = row.porradinhas; // servidor não aceitou tudo (toques rápidos demais)
          saveState();
          if (state.screen === "main" && !state.animating) renderCounter(s.count, false);
        }
      }
    }
    server.offlineSince = 0;
    syncDelay = 0;
  } catch (e) {
    if (state.session && errorCode(e).indexOf("participante_nao_encontrado") !== -1) {
      handleRemoteReset();
    } else {
      if (state.session) { state.session.dirty = true; saveState(); }
      if (!server.offlineSince) server.offlineSince = Date.now();
      syncDelay = Math.min(30000, syncDelay ? syncDelay * 2 : 2000);
      syncSoon(syncDelay);
    }
  } finally {
    syncing = false;
  }
  scheduleRankingRender();
}

// Selo de admin guardado no aparelho só vale se o servidor confirmar
async function verifyAdmin() {
  if (!ONLINE || !state.profile || !(state.profile.permissions || []).length) return;
  try {
    if (!(await rpc("am_admin", {}))) {
      state.profile.permissions = [];
      saveState();
      if (state.screen === "main") renderMain();
      if (state.screen === "ranking") renderRanking();
    }
  } catch (e) { /* sem rede: confere na próxima */ }
}

function startServer() {
  if (!ONLINE) return;
  fetchRanking();
  ensureAuth()
    .then(() => { subscribeRanking(); syncSoon(); verifyAdmin(); })
    .catch(() => setTimeout(startServer, 5000));
}

/* ============================== SYNC entre abas ============================== */
// Sem servidor, o "ao vivo" funciona entre abas/janelas do mesmo aparelho.
function onStorageSync(e) {
  if (!e.key || e.key.indexOf(STORAGE_PREFIX) !== 0) return;
  const key = e.key.slice(STORAGE_PREFIX.length);
  if (!["profile", "session", "result", "ranking", "demoHidden"].includes(key)) return;
  const screen = state.screen;
  loadState();
  state.screen = screen;
  if (ONLINE) syncSoon(300);
  if (screen === "ranking") renderRanking({ animate: true });
  else if (screen === "main" && state.profile && state.session && !state.animating) renderMain();
  else if (screen === "result" && state.result) renderResult();
}

function isStandalone() {
  return matchMedia("(display-mode: standalone)").matches
    || matchMedia("(display-mode: fullscreen)").matches
    || window.navigator.standalone === true;
}

function detectBrowser() {
  const ua = navigator.userAgent || "";
  const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const android = /Android/i.test(ua);
  const inApp = /Instagram|FBAN|FBAV|FB_IAB|FBIOS|Line\/|Snapchat|TikTok|musical_ly|BytedanceWebview|Twitter|LinkedInApp|GSA\//i.test(ua);
  if (ios) {
    if (inApp) return "ios-inapp";
    if (/CriOS/i.test(ua)) return "ios-chrome";
    if (/FxiOS|EdgiOS|OPiOS|YaBrowser/i.test(ua)) return "ios-other";
    return "ios-safari";
  }
  if (android) {
    if (inApp || /; wv\)/.test(ua)) return "android-inapp";
    if (/SamsungBrowser/i.test(ua)) return "android-samsung";
    if (/Firefox/i.test(ua)) return "android-firefox";
    if (/EdgA|OPR|Opera|YaBrowser|MiuiBrowser/i.test(ua)) return "android-other";
    if (/Chrome/i.test(ua)) return "android-chrome";
    return "android-other";
  }
  return "desktop";
}
