      `No Chrome, toque em ${chip("⋮")} e depois em ${chip("Instalar app")}.`,
      `Confirme em ${chip("Instalar")}.`,
    ],
  },
  "android-other": {
    browser: "navegador do Android",
    steps: [
      `Abra o menu do navegador (${chip("⋮")} ou ${chip("≡")}).`,
      `Toque em ${chip("Adicionar à tela inicial")} ou ${chip("Instalar app")}.`,
      `Confirme e abra o App.`,
    ],
    note: "Não achou? Abra o link no Chrome.",
    canPrompt: true,
  },
  desktop: {
    browser: "computador",
    steps: [
      `A Porradinha foi feita pro celular: abra este link no seu telefone.`,
      `iPhone: Safari → ${SHARE_CHIP} → ${chip("Adicionar à Tela de Início")}.`,
      `Android: Chrome → ${chip("⋮")} → ${chip("Instalar app")}.`,
    ],
    canPrompt: true,
  },
};

// auto = primeira visita: o botão de fechar fica travado por INSTALL_HINT_LOCK_SECONDS.
function openInstallGuide(auto) {
  const guide = INSTALL_GUIDES[detectBrowser()] || INSTALL_GUIDES.desktop;
  const node = document.createElement("div");
  node.className = "install";
  node.innerHTML =
    `<div class="install-browser">Você abriu pelo <b>${guide.browser}</b></div>` +
    `<ol class="install-steps">${guide.steps.map((s) => `<li><span>${s}</span></li>`).join("")}</ol>` +
    (guide.note ? `<p class="install-note">${guide.note}</p>` : "");

  if (guide.canPrompt && deferredInstallPrompt) {
    const installBtn = document.createElement("button");
    installBtn.type = "button";
    installBtn.className = "btn";
    installBtn.textContent = "📲 INSTALAR AGORA";
    installBtn.addEventListener("click", async () => {
      const prompt = deferredInstallPrompt;
      if (!prompt) return;
      deferredInstallPrompt = null;
      prompt.prompt();
      try {
        const choice = await prompt.userChoice;
        if (choice && choice.outcome === "accepted") { storage.set("installHintSeen", true); closeSheet(null); }
      } catch (e) {}
    });
    node.appendChild(installBtn);
  }

  const lockMs = auto ? INSTALL_HINT_LOCK_SECONDS * 1000 : 0;
  openSheet({
    emoji: "📲",
    title: "COLOCA NA TELA INICIAL",
    text: "Assim a Porradinha abre em tela cheia, direto pelo App.",
    node,
    signed: true,
    kind: "install",
    lockBackdrop: auto,
    buttons: [{ label: "ENTENDI", value: "ok", style: "white" }],
    onMount(sheet) {
      if (!lockMs) return;
      const closeBtn = sheet.querySelector(".actions .btn");
      const bar = document.createElement("div");
      bar.className = "install-timer";
      bar.innerHTML = `<i style="animation-duration:${lockMs}ms"></i>`;
      closeBtn.parentNode.appendChild(bar);
      closeBtn.disabled = true;
      const endsAt = Date.now() + lockMs;
      let timer = null;
      const update = () => {
        const left = Math.ceil((endsAt - Date.now()) / 1000);
        if (left > 0) { closeBtn.textContent = `PODE FECHAR EM ${left}s`; return; }
        clearInterval(timer);
        closeBtn.disabled = false;
        closeBtn.textContent = "ENTENDI";
        bar.remove();
        if (sheetCtx && sheetCtx.kind === "install") sheetCtx.lockBackdrop = false;
      };
      timer = setInterval(update, 200);
      update();
    },
  }).then(() => { if (auto) storage.set("installHintSeen", true); });
}

/* ============================== DEVICE (sem zoom, só na vertical) ============================== */
function lockZoom() {
  const content = "width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover";
  document.querySelectorAll('meta[name="viewport"]').forEach((m) => m.setAttribute("content", content));
  const block = (e) => e.preventDefault();
  // iPhone ignora user-scalable=no: bloqueia a pinça pelos eventos de gesto
  ["gesturestart", "gesturechange", "gestureend"].forEach((t) => document.addEventListener(t, block, { passive: false }));
  document.addEventListener("touchmove", (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener("dblclick", block, { passive: false });
  let lastTouchEnd = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    const onControl = e.target.closest && e.target.closest("button, input, label, a, [role='button'], .slider");
    if (now - lastTouchEnd < 320 && !onControl) e.preventDefault(); // duplo toque fora de botões
    lastTouchEnd = now;
  }, { passive: false });
  document.addEventListener("wheel", (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && ["+", "-", "=", "0"].includes(e.key)) e.preventDefault();
  });
}

// Deitado = o aparelho diz que está na horizontal E a página está mais larga que alta, em tela de celular.
// Não usa media query de orientação: no Android o teclado encolhe a página e "vira" paisagem.
function watchOrientation() {
  const update = () => {
    const type = screen.orientation && screen.orientation.type;
    const byDevice = type ? type.indexOf("landscape") === 0
      : typeof window.orientation === "number" ? Math.abs(window.orientation) === 90 : null;
    const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    const wide = window.innerWidth > window.innerHeight;
    const phone = Math.min(screen.width, screen.height) <= 520;
    const landscape = phone && (byDevice === null ? wide && !typing : byDevice && (wide || typing));
    document.documentElement.classList.toggle("is-landscape", !!landscape);
  };
  window.addEventListener("resize", update);
  window.addEventListener("orientationchange", update);
  if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener("change", update);
  document.addEventListener("focusin", update);
  document.addEventListener("focusout", () => setTimeout(update, 300));
  update();
  try {
    const p = screen.orientation && screen.orientation.lock && screen.orientation.lock("portrait");
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}

/* ============================== NAVIGATION ============================== */
const SCREENS = ["start", "main", "result", "ranking"];

function go(screen) {
  if (screen === "main" && (!state.profile || !state.session)) screen = "start";
  if (screen === "result" && !state.result) screen = state.session ? "main" : "start";
  state.screen = screen;
  storage.set("screen", screen);
  if (sheetCtx) closeSheet(null);
  SCREENS.forEach((s) => { $("#screen-" + s).hidden = s !== screen; });
  $("#screen-" + screen).scrollTop = 0;
  if (screen === "start") syncPasswordField();
  if (screen === "main") renderMain();
  if (screen === "result") renderResult();
  if (screen === "ranking") {
    renderRanking();
    if (ONLINE && Date.now() - server.lastFetch > 5000) fetchRanking();
  }
  tick();
}

function renderMain() {
  $("#mainNick").textContent = state.profile.nick;
  const org = $("#mainOrg");
  const badge = profileBadge();
  org.textContent = "";
  if (badge) {
    const tag = document.createElement("span");
    tag.className = "role-tag";
    tag.textContent = badge;
    org.appendChild(tag);
  }
  org.appendChild(document.createTextNode(state.profile.org || ""));
  org.hidden = !state.profile.org && !badge;
  if (!state.animating) {
    renderCounter(state.session.count, false);
    setFill(cooldownProgress(), 0);
  }
}

// ENCERRAR: volta ao início. O histórico do ranking local é mantido.
function endAll() {
  if (ONLINE && state.session && state.session.remoteId && state.session.dirty) {
    state.outbox.push({ p_id: state.session.remoteId, p_count: state.session.count, p_status: state.result ? "finished" : "drinking" });
  }
  if (ONLINE && profileBadge()) rpc("release_admin", {}).catch(() => {});
  state.profile = null;
  state.session = null;
  state.result = null;
  saveState();
  $("#inNick").value = "";
  $("#inOrg").value = "";
  $("#inPass").value = "";
  go("start");
  syncSoon();
}

function init() {
  loadState();
  saveState(); // grava ajustes de formato (ex.: id em contagem antiga)
  lockZoom();
  watchOrientation();
  mountArt();
  setupIcons();
  initSlider();

  $("#startForm").addEventListener("submit", onStartSubmit);
  $("#inNick").addEventListener("input", () => {
    clearFieldError("fieldNick", "nickError");
    syncPasswordField();
  });
  $("#inNick").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); ($("#fieldPass").hidden ? $("#inOrg") : $("#inPass")).focus(); }
  });
  $("#inPass").addEventListener("input", () => clearFieldError("fieldPass", "passError"));
  $("#inPass").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); $("#inOrg").focus(); }
  });
  $("#installLink").hidden = isStandalone();
  $("#installLink").addEventListener("click", () => openInstallGuide(false));
  $("#startRankingLink").addEventListener("click", () => go("ranking"));
  $("#rankingBtn").addEventListener("click", () => { if (!state.animating) go("ranking"); });
  $("#drinkBtn").addEventListener("click", tryDrink);
  $("#cupPos").addEventListener("click", tryDrink);
  $("#cupPos").addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tryDrink(); }
  });
  $("#menuBtn").addEventListener("click", openMenu);
  $("#toRankingBtn").addEventListener("click", () => go("ranking"));
  $("#rankBackBtn").addEventListener("click", rankingBack);
  $("#filterBtn").addEventListener("click", openFilterSheet);
  $("#resetRankingBtn").addEventListener("click", resetRanking);
  window.addEventListener("storage", onStorageSync);
  $("#endBtn").addEventListener("click", endAll);
  $("#undoBtn").addEventListener("click", undoFinish);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && sheetCtx && !sheetCtx.lockBackdrop) closeSheet(null);
  });
  document.addEventListener("visibilitychange", tick);

  // Retoma de onde parou (atualizar a página não perde nada)
  let screen = "start";
  if (state.result) screen = "result";
  else if (state.profile && state.session) screen = "main";
  if (state.screen === "ranking") screen = "ranking";
  go(screen);
  setInterval(tick, 250);

  // Servidor: login anônimo, ranking ao vivo e envio do que ficou pendente
  startServer();
  window.addEventListener("online", () => { syncSoon(); fetchRanking(); });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { syncSoon(); fetchRanking(); }
  });
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  // Primeira visita: ensina a colocar na tela inicial
  if (!isStandalone() && !storage.get("installHintSeen", false)) openInstallGuide(true);
}

init();
</script>
